name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            dependencies: lowest
          - php: '8.2'
            dependencies: stable
          - php: '8.4'
            dependencies: stable

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Install stable dependencies
        if: matrix.dependencies == 'stable'
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Validate package and run quality checks
        run: composer validate --strict && composer check
